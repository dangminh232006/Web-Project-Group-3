  <g fill="none" stroke="#0d4f5c" stroke-opacity="0.09" stroke-width="1.5">
    <path d="M0 90 H120"/>
    <path d="M0 60 H120"/>
    <path d="M0 30 H120"/>
    <circle cx="30" cy="60" r="10"/>
    <circle cx="90" cy="30" r="14"/>
    <path d="M60 120 V0"/>
  </g>
</svg>
